<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0014;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
canvas {
  display: block;
  image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Config ---
const W = 480, H = 720;
canvas.width = W; canvas.height = H;

// Scale canvas to fit viewport
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// --- Colors ---
const COL = {
  bg: '#0a0014',
  grid: '#1a0a2e',
  shipBody: '#00f0ff',
  shipGlow: '#00f0ff',
  asteroid: '#8a2be2',
  asteroidLight: '#bf5fff',
  orb: '#ff2d95',
  orbGlow: '#ff69b4',
  trailCyan: '#00f0ff',
  trailPink: '#ff2d95',
  hitFlash: '#ff0055',
  textPrimary: '#ff2d95',
  textSecondary: '#00f0ff',
  combo: '#ffdd00',
};

// --- State ---
let state = 'menu'; // menu, playing, dead
let score = 0, highScore = 0, combo = 1, comboTimer = 0;
let shipX = W / 2, shipY = H - 120;
let shipVX = 0, shipInvincible = 0, lives = 3;
let shakeX = 0, shakeY = 0, shakeMag = 0;
let particles = [], asteroids = [], orbs = [], stars = [], gridOffset = 0;
let spawnTimer = 0, orbSpawnTimer = 0, difficulty = 1, frameCount = 0;
let flashAlpha = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') e.preventDefault();
  if (state === 'menu' && (e.key === ' ' || e.key === 'Enter')) startGame();
  if (state === 'dead' && (e.key === ' ' || e.key === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch controls
let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'menu' || state === 'dead') { startGame(); return; }
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) / rect.width * W;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) / rect.width * W;
});
canvas.addEventListener('touchend', e => { e.preventDefault(); touchX = null; });

// Load high score
try { highScore = parseInt(localStorage.getItem('starfieldHS')) || 0; } catch(e) {}

// --- Init stars ---
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    speed: 0.3 + Math.random() * 2.5,
    size: 0.5 + Math.random() * 1.5,
    brightness: 0.3 + Math.random() * 0.7,
  });
}

function startGame() {
  state = 'playing';
  score = 0; combo = 1; comboTimer = 0; lives = 3;
  shipX = W / 2; shipVX = 0; shipInvincible = 0;
  asteroids = []; orbs = []; particles = [];
  spawnTimer = 0; orbSpawnTimer = 0; difficulty = 1;
  flashAlpha = 0; shakeMag = 0; frameCount = 0;
}

// --- Particle system ---
function emitParticles(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const s = (0.5 + Math.random()) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s,
      life: (0.5 + Math.random() * 0.5) * life,
      maxLife: life,
      color,
      size: (0.5 + Math.random()) * size,
    });
  }
}

function emitTrail(x, y) {
  const colors = [COL.trailCyan, COL.trailPink, '#a855f7'];
  particles.push({
    x: x + (Math.random() - 0.5) * 8,
    y: y + 5,
    vx: (Math.random() - 0.5) * 0.5,
    vy: 1 + Math.random() * 2,
    life: 0.4 + Math.random() * 0.3,
    maxLife: 0.6,
    color: colors[Math.floor(Math.random() * colors.length)],
    size: 1.5 + Math.random() * 2,
  });
}

// --- Update ---
function update(dt) {
  frameCount++;
  difficulty = 1 + score / 500;

  // Grid scroll
  gridOffset = (gridOffset + dt * 80 * Math.min(difficulty, 3)) % 60;

  // Stars
  for (const s of stars) {
    s.y += s.speed * dt * 60 * Math.min(difficulty, 2.5);
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  // Ship movement
  if (state === 'playing') {
    const accel = 1800;
    const friction = 0.88;
    if (touchX !== null) {
      const diff = touchX - shipX;
      shipVX += diff * 8 * dt;
    } else {
      if (keys['ArrowLeft'] || keys['a']) shipVX -= accel * dt;
      if (keys['ArrowRight'] || keys['d']) shipVX += accel * dt;
    }
    shipVX *= friction;
    shipX += shipVX * dt;
    shipX = Math.max(20, Math.min(W - 20, shipX));

    // Trail
    if (frameCount % 2 === 0) {
      emitTrail(shipX - 8, shipY + 14);
      emitTrail(shipX + 8, shipY + 14);
    }

    // Invincibility
    if (shipInvincible > 0) shipInvincible -= dt;

    // Combo decay
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 1;
    }

    // Spawn asteroids
    const spawnRate = Math.max(0.15, 0.6 - difficulty * 0.04);
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = spawnRate;
      const size = 12 + Math.random() * 22;
      const speed = (120 + Math.random() * 80) * Math.min(difficulty, 4);
      asteroids.push({
        x: 30 + Math.random() * (W - 60),
        y: -size,
        size,
        speed,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 3,
        vertices: generateAsteroidShape(size),
      });
    }

    // Spawn orbs
    orbSpawnTimer -= dt;
    if (orbSpawnTimer <= 0) {
      orbSpawnTimer = 1.2 + Math.random() * 1.5;
      orbs.push({
        x: 30 + Math.random() * (W - 60),
        y: -15,
        speed: 100 + Math.random() * 60,
        pulse: Math.random() * Math.PI * 2,
      });
    }

    // Update asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.y += a.speed * dt;
      a.rot += a.rotSpeed * dt;
      if (a.y > H + 50) { asteroids.splice(i, 1); continue; }

      // Collision
      if (shipInvincible <= 0) {
        const dx = a.x - shipX, dy = a.y - shipY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < a.size + 12) {
          // Hit!
          lives--;
          shipInvincible = 1.5;
          shakeMag = 12;
          flashAlpha = 0.6;
          combo = 1;
          comboTimer = 0;
          emitParticles(shipX, shipY, 30, COL.hitFlash, 4, 0.8, 3);
          emitParticles(a.x, a.y, 15, COL.asteroidLight, 3, 0.6, 2);
          asteroids.splice(i, 1);
          if (lives <= 0) {
            die();
          }
        }
      }
    }

    // Update orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.y += o.speed * dt;
      o.pulse += dt * 5;
      if (o.y > H + 20) { orbs.splice(i, 1); continue; }

      const dx = o.x - shipX, dy = o.y - shipY;
      if (Math.sqrt(dx * dx + dy * dy) < 28) {
        score += 10 * combo;
        comboTimer = 2.5;
        combo = Math.min(combo + 1, 20);
        emitParticles(o.x, o.y, 20, COL.orbGlow, 3, 0.7, 2.5);
        emitParticles(o.x, o.y, 10, COL.combo, 2, 0.5, 1.5);
        orbs.splice(i, 1);
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Screen shake
  if (shakeMag > 0) {
    shakeX = (Math.random() - 0.5) * shakeMag;
    shakeY = (Math.random() - 0.5) * shakeMag;
    shakeMag *= 0.88;
    if (shakeMag < 0.3) shakeMag = 0;
  } else {
    shakeX = shakeY = 0;
  }

  // Flash fade
  if (flashAlpha > 0) flashAlpha *= 0.9;
}

function die() {
  state = 'dead';
  emitParticles(shipX, shipY, 60, COL.trailCyan, 5, 1.2, 3);
  emitParticles(shipX, shipY, 40, COL.trailPink, 4, 1, 2.5);
  emitParticles(shipX, shipY, 30, '#ffffff', 3, 0.8, 2);
  shakeMag = 20;
  flashAlpha = 1;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('starfieldHS', highScore); } catch(e) {}
  }
}

function generateAsteroidShape(size) {
  const verts = [];
  const n = 7 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2;
    const r = size * (0.7 + Math.random() * 0.35);
    verts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
  }
  return verts;
}

// --- Draw ---
function draw() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0014');
  bgGrad.addColorStop(0.5, '#120025');
  bgGrad.addColorStop(1, '#1a0040');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Perspective grid
  drawGrid();

  // Stars
  for (const s of stars) {
    const a = s.brightness * (0.6 + 0.4 * Math.sin(frameCount * 0.02 + s.x));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.speed > 1.5 ? '#c8a0ff' : s.speed > 1 ? '#8080ff' : '#ffffff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  // Side glow strips (synthwave horizon feel)
  const sideGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
  sideGrad.addColorStop(0, 'rgba(255,45,149,0)');
  sideGrad.addColorStop(0.6, 'rgba(255,45,149,0.03)');
  sideGrad.addColorStop(1, 'rgba(255,45,149,0.1)');
  ctx.fillStyle = sideGrad;
  ctx.fillRect(0, 0, W, H);

  // Particles (behind everything)
  drawParticles();

  // Orbs
  for (const o of orbs) {
    const pulse = 1 + Math.sin(o.pulse) * 0.2;
    const r = 10 * pulse;

    // Outer glow
    const glow = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 3);
    glow.addColorStop(0, 'rgba(255,45,149,0.4)');
    glow.addColorStop(0.5, 'rgba(255,45,149,0.1)');
    glow.addColorStop(1, 'rgba(255,45,149,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(o.x - r * 3, o.y - r * 3, r * 6, r * 6);

    // Inner orb
    const inner = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
    inner.addColorStop(0, '#ffffff');
    inner.addColorStop(0.3, COL.orb);
    inner.addColorStop(1, 'rgba(255,45,149,0.3)');
    ctx.beginPath();
    ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
    ctx.fillStyle = inner;
    ctx.fill();
  }

  // Asteroids
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    // Glow
    const ag = ctx.createRadialGradient(0, 0, a.size * 0.3, 0, 0, a.size * 1.5);
    ag.addColorStop(0, 'rgba(138,43,226,0.2)');
    ag.addColorStop(1, 'rgba(138,43,226,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(-a.size * 1.5, -a.size * 1.5, a.size * 3, a.size * 3);

    // Body
    ctx.beginPath();
    ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
    for (let i = 1; i < a.vertices.length; i++) {
      ctx.lineTo(a.vertices[i].x, a.vertices[i].y);
    }
    ctx.closePath();

    const asteroidGrad = ctx.createLinearGradient(-a.size, -a.size, a.size, a.size);
    asteroidGrad.addColorStop(0, '#5b2d8e');
    asteroidGrad.addColorStop(0.5, COL.asteroid);
    asteroidGrad.addColorStop(1, '#4a1a6b');
    ctx.fillStyle = asteroidGrad;
    ctx.fill();
    ctx.strokeStyle = COL.asteroidLight;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  // Ship
  if (state === 'playing' || state === 'menu') {
    const drawShip = state === 'menu' ? W / 2 : shipX;
    const drawY = shipY;

    if (shipInvincible > 0 && Math.floor(shipInvincible * 10) % 2 === 0) {
      // blink
    } else {
      // Engine glow
      const eg = ctx.createRadialGradient(drawShip, drawY + 18, 0, drawShip, drawY + 18, 30);
      eg.addColorStop(0, 'rgba(0,240,255,0.5)');
      eg.addColorStop(0.5, 'rgba(168,85,247,0.2)');
      eg.addColorStop(1, 'rgba(0,240,255,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(drawShip - 30, drawY - 12, 60, 60);

      // Ship body
      ctx.beginPath();
      ctx.moveTo(drawShip, drawY - 20);
      ctx.lineTo(drawShip - 16, drawY + 14);
      ctx.lineTo(drawShip - 6, drawY + 8);
      ctx.lineTo(drawShip, drawY + 18);
      ctx.lineTo(drawShip + 6, drawY + 8);
      ctx.lineTo(drawShip + 16, drawY + 14);
      ctx.closePath();

      const shipGrad = ctx.createLinearGradient(drawShip, drawY - 20, drawShip, drawY + 18);
      shipGrad.addColorStop(0, '#ffffff');
      shipGrad.addColorStop(0.3, COL.shipBody);
      shipGrad.addColorStop(1, '#0066aa');
      ctx.fillStyle = shipGrad;
      ctx.fill();

      // Ship outline glow
      ctx.shadowColor = COL.shipGlow;
      ctx.shadowBlur = 15;
      ctx.strokeStyle = COL.shipGlow;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Cockpit
      ctx.beginPath();
      ctx.arc(drawShip, drawY - 2, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  // Hit flash overlay
  if (flashAlpha > 0.01) {
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = COL.hitFlash;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.globalAlpha = 1;
  }

  // HUD
  if (state === 'playing') drawHUD();
  if (state === 'menu') drawMenu();
  if (state === 'dead') drawDeath();

  ctx.restore();
}

function drawGrid() {
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#a855f7';
  ctx.lineWidth = 1;

  // Horizontal lines (perspective)
  const horizonY = H * 0.35;
  for (let i = 0; i < 20; i++) {
    const t = (i * 60 + gridOffset) / (H - horizonY + 20 * 60);
    const y = horizonY + t * t * (H - horizonY) * 20;
    if (y > H) continue;
    if (y < horizonY) continue;
    const alpha = (y - horizonY) / (H - horizonY);
    ctx.globalAlpha = alpha * 0.15;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Vertical lines (converging)
  ctx.globalAlpha = 0.08;
  const cx = W / 2;
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 5, horizonY);
    ctx.lineTo(cx + i * 50, H);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.size * 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * t, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawHUD() {
  // Score
  ctx.save();
  ctx.shadowColor = COL.textSecondary;
  ctx.shadowBlur = 10;
  ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = COL.textSecondary;
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 16, 34);
  ctx.font = 'bold 30px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(score.toString(), 16, 66);

  // Combo
  if (combo > 1) {
    ctx.shadowColor = COL.combo;
    ctx.fillStyle = COL.combo;
    ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    const pulse = 1 + Math.sin(frameCount * 0.15) * 0.08;
    ctx.save();
    ctx.translate(W / 2, 50);
    ctx.scale(pulse, pulse);
    ctx.fillText(`x${combo} COMBO`, 0, 0);
    ctx.restore();
  }

  // Lives
  ctx.textAlign = 'right';
  ctx.shadowColor = COL.textPrimary;
  ctx.shadowBlur = 8;
  for (let i = 0; i < lives; i++) {
    const lx = W - 20 - i * 28;
    ctx.fillStyle = COL.textPrimary;
    ctx.beginPath();
    ctx.moveTo(lx, 22);
    ctx.lineTo(lx - 8, 36);
    ctx.lineTo(lx + 8, 36);
    ctx.closePath();
    ctx.fill();
  }

  // High score
  ctx.font = '13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#a855f7';
  ctx.shadowBlur = 0;
  ctx.textAlign = 'right';
  ctx.fillText(`HI ${highScore}`, W - 16, 56);

  ctx.restore();
}

function drawMenu() {
  ctx.save();

  // Title
  ctx.textAlign = 'center';
  ctx.shadowColor = COL.textPrimary;
  ctx.shadowBlur = 30;
  ctx.font = 'bold 42px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = COL.textPrimary;
  ctx.fillText('STARFIELD', W / 2, H * 0.28);
  ctx.shadowColor = COL.textSecondary;
  ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = COL.textSecondary;
  ctx.fillText('RUNNER', W / 2, H * 0.35);

  // Subtitle
  ctx.shadowBlur = 0;
  ctx.font = '16px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#a855f7';
  const blink = Math.sin(frameCount * 0.06) > 0;
  if (blink) {
    ctx.fillText('PRESS SPACE OR TAP TO START', W / 2, H * 0.48);
  }

  // Controls
  ctx.font = '13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(168,85,247,0.7)';
  ctx.fillText('ARROW KEYS / WASD / TOUCH TO MOVE', W / 2, H * 0.56);
  ctx.fillText('COLLECT ORBS \u2022 DODGE ASTEROIDS', W / 2, H * 0.60);

  // High score
  if (highScore > 0) {
    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = COL.combo;
    ctx.shadowColor = COL.combo;
    ctx.shadowBlur = 10;
    ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H * 0.68);
  }

  ctx.restore();
}

function drawDeath() {
  ctx.save();

  // Dim overlay
  ctx.fillStyle = 'rgba(10,0,20,0.6)';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.textAlign = 'center';

  // Game Over
  ctx.shadowColor = COL.hitFlash;
  ctx.shadowBlur = 25;
  ctx.font = 'bold 48px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = COL.hitFlash;
  ctx.fillText('GAME OVER', W / 2, H * 0.32);

  // Score
  ctx.shadowColor = COL.textSecondary;
  ctx.shadowBlur = 15;
  ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = COL.textSecondary;
  ctx.fillText('SCORE', W / 2, H * 0.42);
  ctx.font = 'bold 44px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(score.toString(), W / 2, H * 0.50);

  // New high score
  if (score >= highScore && score > 0) {
    ctx.shadowColor = COL.combo;
    ctx.fillStyle = COL.combo;
    ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
    const pulse = 1 + Math.sin(frameCount * 0.1) * 0.1;
    ctx.save();
    ctx.translate(W / 2, H * 0.56);
    ctx.scale(pulse, pulse);
    ctx.fillText('NEW HIGH SCORE!', 0, 0);
    ctx.restore();
  }

  // Restart
  ctx.shadowBlur = 0;
  ctx.font = '15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#a855f7';
  const blink = Math.sin(frameCount * 0.06) > 0;
  if (blink) ctx.fillText('PRESS SPACE OR TAP TO RESTART', W / 2, H * 0.66);

  ctx.restore();
}

// --- Sun glow at horizon (synthwave touch) ---
function drawSun() {
  const cx = W / 2, cy = H * 0.35;
  const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
  sunGrad.addColorStop(0, 'rgba(255,45,149,0.15)');
  sunGrad.addColorStop(0.3, 'rgba(168,85,247,0.08)');
  sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(cx - 120, cy - 120, 240, 240);
}

// --- Main Loop ---
let lastTime = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  update(dt);

  ctx.clearRect(0, 0, W, H);
  drawSun();
  draw();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
